[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent-reproduction"
version = "0.1.0"
description = "Evidence-grounded paper retrieval, based on learn-claude-code mechanisms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "rank-bm25==0.2.2", "faiss-cpu>=1.8,<2", "pypdf>=5,<7", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
models = ["FlagEmbedding==1.3.5", "transformers>=4.44,<4.58"]
api = ["python-dotenv>=1,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
paper-agent = "paper_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
